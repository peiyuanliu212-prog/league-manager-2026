<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>点球时刻 · 第一视角原型</title>
<style>
  :root{ --paper:#f4efe4; --ink:#2b2620; --line:#ddd2b8; --red:#b03a2e; --gold:#a87b1f; --green:#2e6b46; }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ background:#e9e2cf; font-family:"PingFang SC","Microsoft YaHei",sans-serif; color:var(--ink); }
  .wrap{ max-width:430px; margin:0 auto; background:var(--paper); min-height:100vh; padding:12px 12px 28px; }
  .top{ display:flex; justify-content:space-between; align-items:center; }
  .top h1{ font-size:17px; letter-spacing:1px; }
  .top a{ font-size:12px; color:var(--gold); text-decoration:none; }
  .score{ display:flex; gap:8px; margin-top:10px; }
  .score .cell{ flex:1; background:#fffdf6; border:1px solid var(--line); border-radius:10px; padding:7px 10px; text-align:center; }
  .score .cell b{ font-size:17px; display:block; }
  .score .cell span{ font-size:11px; color:#8a8272; }
  .modebar{ margin-top:10px; text-align:center; font-size:13px; }
  .modebar .tag{ display:inline-block; padding:3px 12px; border-radius:999px; background:var(--ink); color:#f7f1de; font-size:12px; letter-spacing:2px; }
  .modebar .who{ margin-top:5px; color:#6d6350; font-size:12px; }
  /* scene */
  .scene{ position:relative; margin-top:10px; height:330px; border-radius:14px; overflow:hidden; border:1px solid var(--line);
    background:linear-gradient(#7d94a6 0 26%, #8fae7e 26% 30%, #6f9a5f 30% 100%); }
  .stand{ position:absolute; left:0; right:0; top:0; height:26%; opacity:.5;
    background:repeating-linear-gradient(90deg,#5d7284 0 7px,#6d8397 7px 14px); }
  .goal{ position:absolute; left:7%; right:7%; top:11%; height:56%; border:5px solid #fdfdf8; border-bottom:none; border-radius:4px 4px 0 0;
    background:repeating-linear-gradient(0deg, rgba(255,255,255,.20) 0 2px, transparent 2px 16px), repeating-linear-gradient(90deg, rgba(255,255,255,.20) 0 2px, transparent 2px 16px); cursor:crosshair; }
  .goal .post{ position:absolute; bottom:-4px; left:0; right:0; height:4px; background:rgba(253,253,248,.0); }
  .zone{ position:absolute; border:1.5px dashed rgba(255,255,255,0); border-radius:6px; cursor:pointer; }
  .zone.sel{ border-color:#ffd34d; background:rgba(255,211,77,.18); }
  .keeper{ position:absolute; left:50%; bottom:31%; width:64px; height:118px; margin-left:-32px; transition:transform .48s cubic-bezier(.2,.7,.3,1); transform-origin:50% 85%; z-index:3; }
  .ball{ position:absolute; left:50%; bottom:4.5%; width:30px; height:30px; margin-left:-15px; border-radius:50%; z-index:4;
    background:radial-gradient(circle at 35% 32%, #ffffff 0 34%, #d9d9d9 35% 52%, #2b2620 53% 60%, #f2f2f2 61% 100%);
    box-shadow:0 3px 5px rgba(0,0,0,.35); transition:all .5s cubic-bezier(.25,.6,.35,1); }
  .spot{ position:absolute; left:50%; bottom:6.2%; width:8px; height:3px; margin-left:-4px; background:rgba(255,255,255,.85); border-radius:50%; }
  .aim{ position:absolute; width:26px; height:26px; margin:-13px 0 0 -13px; border:2.5px solid #ffd34d; border-radius:50%; z-index:5; pointer-events:none; display:none;
    box-shadow:0 0 0 2px rgba(0,0,0,.25), inset 0 0 0 2px rgba(0,0,0,.15); }
  .aim::after{ content:""; position:absolute; left:50%; top:50%; width:4px; height:4px; margin:-2px; background:#ffd34d; border-radius:50%; }
  .savehint{ position:absolute; left:0; right:0; bottom:31%; text-align:center; color:#fff; font-size:12px; text-shadow:0 1px 3px rgba(0,0,0,.5); z-index:2; pointer-events:none; }
  .banner{ position:absolute; left:50%; top:38%; transform:translate(-50%,-50%) scale(.8); z-index:6; font-size:34px; font-weight:800; letter-spacing:4px;
    color:#fff; text-shadow:0 2px 0 rgba(0,0,0,.25), 0 4px 14px rgba(0,0,0,.4); opacity:0; pointer-events:none; white-space:nowrap; }
  .banner.show{ animation:bin .45s cubic-bezier(.2,1.4,.4,1) forwards; }
  @keyframes bin{ to{ opacity:1; transform:translate(-50%,-50%) scale(1); } }
  /* controls */
  .panel{ margin-top:12px; background:#fffdf6; border:1px solid var(--line); border-radius:12px; padding:12px; }
  .hint{ font-size:13px; color:#6d6350; line-height:1.55; }
  .hint b{ color:var(--ink); }
  .riskline{ margin-top:8px; font-size:12.5px; display:flex; justify-content:space-between; }
  .riskline .rk{ font-weight:700; }
  .barwrap{ margin-top:12px; }
  .bar{ position:relative; height:20px; border-radius:10px; background:linear-gradient(90deg,#c0392b 0 30%,#e6c65a 30% 44%,#2e6b46 44% 56%,#e6c65a 56% 70%,#c0392b 70% 100%); overflow:hidden; }
  .marker{ position:absolute; top:0; bottom:0; width:5px; background:#fff; box-shadow:0 0 0 1.5px rgba(0,0,0,.45); left:0; }
  .barlabels{ display:flex; justify-content:space-between; font-size:10.5px; color:#8a8272; margin-top:3px; }
  button.main{ width:100%; margin-top:12px; padding:13px; font-size:16px; letter-spacing:3px; border:none; border-radius:11px; background:var(--red); color:#fff; font-weight:700; cursor:pointer; }
  button.main:disabled{ background:#c9bfa5; }
  button.mini{ margin-top:10px; padding:7px 14px; font-size:12px; border-radius:999px; border:1px solid var(--line); background:#fffdf6; cursor:pointer; }
  .flavor{ margin-top:10px; font-size:13.5px; line-height:1.6; min-height:22px; }
  .flavor .q{ color:var(--gold); font-weight:700; }
  .foot{ margin-top:14px; font-size:11px; color:#a2987f; text-align:center; line-height:1.6; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>⚽ 点球时刻 · 原型</h1><a href="index.html">← 返回游戏</a></div>
  <div class="score">
    <div class="cell"><b id="shootStat">0/0</b><span>我主罚</span></div>
    <div class="cell"><b id="saveStat">0/0</b><span>我扑救（扑出）</span></div>
    <div class="cell"><b id="convRate">—</b><span>主罚转化率</span></div>
  </div>
  <div class="modebar"><span class="tag" id="modeTag">我方点球</span><div class="who" id="whoLine"></div></div>

  <div class="scene" id="scene">
    <div class="stand"></div>
    <div class="goal" id="goal"></div>
    <svg class="keeper" id="keeper" viewBox="0 0 64 118">
      <circle cx="32" cy="14" r="10" fill="#3a352b"/>
      <path d="M32 24v34" stroke="#3a352b" stroke-width="9" stroke-linecap="round"/>
      <path d="M30 30 L6 44 M34 30 L58 44" stroke="#3a352b" stroke-width="7" stroke-linecap="round"/>
      <path d="M30 56 L22 96 M34 56 L43 96" stroke="#3a352b" stroke-width="8" stroke-linecap="round"/>
      <path d="M20 32h24l-3 26H23z" fill="#b03a2e"/>
    </svg>
    <div class="savehint" id="saveHint" style="display:none">点选一个区域，赌他射那边</div>
    <div class="spot"></div>
    <div class="ball" id="ball"></div>
    <div class="aim" id="aim"></div>
    <div class="banner" id="banner"></div>
  </div>

  <div class="panel" id="shootPanel">
    <div class="hint" id="shootHint">第一步：<b>点球门</b>选落点。越靠死角越难扑，但打飞的风险也越大。</div>
    <div class="riskline"><span>落点：<span class="rk" id="zoneName">未选择</span></span><span>打偏风险：<span class="rk" id="riskPct">—</span></span></div>
    <div class="barwrap" id="barWrap" style="display:none">
      <div class="hint">第二步：等指针进<b>绿区</b>时点「射门！」——绿区是完美发力，红区容易打飞。</div>
      <div class="bar"><div class="marker" id="marker"></div></div>
      <div class="barlabels"><span>发力过猛</span><span>一般</span><span>完美</span><span>一般</span><span>发力过猛</span></div>
    </div>
    <button class="main" id="actionBtn" disabled>先点球门选落点</button>
    <div class="flavor" id="flavor"></div>
  </div>
  <div class="foot">第一视角点球原型 · 攻守轮换验手感用，数值未定版（目标：会玩的主罚转化率 ≈75%）<br>
  <button class="mini" id="resetBtn">清空战绩</button> <button class="mini" id="sndBtn">🔊 音效开</button></div>
</div>

<script>
"use strict";
// ---------- tiny synth ----------
let AC = null, muted = false;
function ac(){ if(!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if(AC.state === "suspended") AC.resume(); return AC; }
function tone(f, t0, d, type, g){ if(muted) return; try{ const a = ac(), o = a.createOscillator(), v = a.createGain(); o.type = type || "sine"; o.frequency.value = f; v.gain.setValueAtTime(g || .12, a.currentTime + t0); v.gain.exponentialRampToValueAtTime(.001, a.currentTime + t0 + d); o.connect(v).connect(a.destination); o.start(a.currentTime + t0); o.stop(a.currentTime + t0 + d); }catch(e){} }
function noise(t0, d, g){ if(muted) return; try{ const a = ac(), len = a.sampleRate * d, buf = a.createBuffer(1, len, a.sampleRate), ch = buf.getChannelData(0); for(let i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / len); const src = a.createBufferSource(); src.buffer = buf; const v = a.createGain(); v.gain.value = g; const f = a.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 900; src.connect(f).connect(v).connect(a.destination); src.start(a.currentTime + t0); }catch(e){} }
const SFX = { kick(){ noise(0, .12, .5); tone(90, 0, .12, "sine", .25); },
  cheer(){ noise(0, .9, .16); tone(523, .05, .3, "triangle", .05); tone(659, .12, .3, "triangle", .05); tone(784, .2, .4, "triangle", .05); },
  groan(){ tone(196, 0, .5, "sawtooth", .045); tone(165, .1, .6, "sawtooth", .04); noise(0, .5, .05); },
  whistle(n){ for(let i = 0; i < (n || 1); i++) tone(2350, i * .22, .16, "square", .028); } };

// ---------- state ----------
const SHOOTERS = ["梅西", "C罗", "姆巴佩", "哈兰德", "凯恩", "萨拉赫"];
const KEEPERS = ["库尔图瓦", "多纳鲁马", "阿利松", "奥布拉克"];
const $ = id => document.getElementById(id);
const goal = $("goal"), scene = $("scene"), ball = $("ball"), keeperEl = $("keeper"), aimEl = $("aim");
let mode = "shoot";               // shoot | save
let phase = "aim";                // aim | power | done
let aim = null;                   // {nx, ny, x, y} in scene coords for ball flight
let savePick = null;              // {c, r}
let barAnim = null, barPos = 0, barDir = 1;
let stats = { shoot: [0, 0], save: [0, 0] };   // [success, total]
let history = [];                 // shooter thirds history (for keeper reads)
let busy = false;

function goalRect(){ return goal.getBoundingClientRect(); }
function sceneRect(){ return scene.getBoundingClientRect(); }
function pick(a){ return a[Math.floor(Math.random() * a.length)]; }

function zoneInfo(nx, ny){
  const edge = Math.min(nx, 1 - nx), top = ny;
  const corner = (nx < .18 || nx > .82) && (ny < .30 || ny > .72);
  const dead = (nx < .13 || nx > .87) && (ny < .24 || ny > .78);
  let name = "中路稳妥", miss = .03;
  if(dead){ name = "死角！"; miss = .13; }
  else if(corner){ name = "刁钻角落"; miss = .09; }
  else if(edge < .22){ name = "贴边"; miss = .06; }
  else if(top < .28){ name = "上角"; miss = .07; }
  return { name, miss, corner: corner || dead, dead };
}

function newRound(){
  busy = false; aim = null; savePick = null; phase = "aim";
  ball.style.transition = "none"; ball.style.left = "50%"; ball.style.bottom = "4.5%"; ball.style.width = "30px"; ball.style.height = "30px"; ball.style.opacity = 1;
  keeperEl.style.transition = "none"; keeperEl.style.transform = "translate(0,0) rotate(0deg)";
  aimEl.style.display = "none";
  document.querySelectorAll(".zone").forEach(z => z.remove());
  $("banner").className = "banner"; $("banner").textContent = "";
  $("flavor").innerHTML = "";
  $("barWrap").style.display = "none";
  const btn = $("actionBtn");
  if(mode === "shoot"){
    $("modeTag").textContent = "我方点球";
    $("whoLine").textContent = `主罚：${pick(SHOOTERS)} · 门将：${pick(KEEPERS)}`;
    $("saveHint").style.display = "none";
    $("shootHint").innerHTML = "第一步：<b>点球门</b>选落点。越靠死角越难扑，但打飞的风险也越大。";
    $("zoneName").textContent = "未选择"; $("riskPct").textContent = "—";
    btn.disabled = true; btn.textContent = "先点球门选落点";
  } else {
    $("modeTag").textContent = "对方点球 · 你是门将";
    $("whoLine").textContent = `主罚：${pick(SHOOTERS)} · 你站在门线上`;
    $("saveHint").style.display = "block";
    $("shootHint").innerHTML = "对方助跑了——<b>点选一个区域</b>赌他射那边，选好自动扑出。九宫格全凭预判。";
    $("zoneName").textContent = "未选择"; $("riskPct").textContent = "—";
    btn.disabled = true; btn.textContent = "先选扑救区域";
    buildZones();
  }
  requestAnimationFrame(() => { ball.style.transition = "all .5s cubic-bezier(.25,.6,.35,1)"; keeperEl.style.transition = "transform .48s cubic-bezier(.2,.7,.3,1)"; });
  SFX.whistle(1);
}

function buildZones(){
  const gr = goalRect(), sr = sceneRect();
  for(let r = 0; r < 3; r++) for(let c = 0; c < 3; c++){
    const z = document.createElement("div"); z.className = "zone";
    z.style.left = (gr.left - sr.left + gr.width * c / 3 + 3) + "px";
    z.style.top = (gr.top - sr.top + gr.height * r / 3 + 3) + "px";
    z.style.width = (gr.width / 3 - 6) + "px"; z.style.height = (gr.height / 3 - 6) + "px";
    z.onclick = ev => { ev.stopPropagation(); if(busy || mode !== "save") return;
      document.querySelectorAll(".zone").forEach(x => x.classList.remove("sel")); z.classList.add("sel");
      savePick = { c, r }; $("zoneName").textContent = ["左", "中", "右"][c] + ["上", "中", "下"][r];
      resolveSave();
    };
    scene.appendChild(z);
  }
}

goal.addEventListener("click", ev => {
  if(mode !== "shoot" || busy || phase !== "aim") return;
  const gr = goalRect(), sr = sceneRect();
  const nx = (ev.clientX - gr.left) / gr.width, ny = (ev.clientY - gr.top) / gr.height;
  aim = { nx: Math.min(.98, Math.max(.02, nx)), ny: Math.min(.97, Math.max(.03, ny)),
          x: ev.clientX - sr.left, y: ev.clientY - sr.top };
  aimEl.style.left = aim.x + "px"; aimEl.style.top = aim.y + "px"; aimEl.style.display = "block";
  const zi = zoneInfo(aim.nx, aim.ny);
  $("zoneName").textContent = zi.name; $("riskPct").textContent = Math.round(zi.miss * 100) + "%";
  $("barWrap").style.display = "block";
  const btn = $("actionBtn"); btn.disabled = false; btn.textContent = "射门！";
  phase = "power"; startBar();
});

function startBar(){
  cancelAnimationFrame(barAnim); barPos = 0; barDir = 1;
  const step = () => { barPos += barDir * 2.1; if(barPos >= 100){ barPos = 100; barDir = -1; } if(barPos <= 0){ barPos = 0; barDir = 1; }
    $("marker").style.left = `calc(${barPos}% - 2px)`; if(phase === "power") barAnim = requestAnimationFrame(step); };
  barAnim = requestAnimationFrame(step);
}
function execOf(pos){ if(pos >= 44 && pos <= 56) return "perfect"; if(pos >= 30 && pos <= 70) return "good"; return "poor"; }

function keeperPickThird(){
  const w = [1, 1, 1];
  if(history.length){ const last = history[history.length - 1]; w[last] += .55;
    if(history.length >= 2 && history[history.length - 2] === last) w[last] += .5; }
  const t = w[0] + w[1] + w[2]; let r = Math.random() * t;
  for(let i = 0; i < 3; i++){ r -= w[i]; if(r <= 0) return i; } return 1;
}
function diveKeeper(third, high){
  const dx = [-118, 0, 118][third], rot = [-30, 0, 30][third], dy = high ? -16 : 4;
  keeperEl.style.transform = `translate(${dx}px, ${dy}px) rotate(${rot}deg)`;
}
function flyBall(x, y, scale){
  const sr = sceneRect();
  ball.style.left = x + "px"; ball.style.top = y + "px"; ball.style.bottom = "auto";
  ball.style.width = (30 * (scale || .62)) + "px"; ball.style.height = (30 * (scale || .62)) + "px";
  ball.style.marginLeft = (-15 * (scale || .62)) + "px";
}
function banner(txt, color){ const b = $("banner"); b.textContent = txt; b.style.color = color || "#fff"; b.className = "banner show"; }
function updStats(){
  $("shootStat").textContent = `${stats.shoot[0]}/${stats.shoot[1]}`;
  $("saveStat").textContent = `${stats.save[0]}/${stats.save[1]}`;
  $("convRate").textContent = stats.shoot[1] ? Math.round(stats.shoot[0] / stats.shoot[1] * 100) + "%" : "—";
}
function endRound(){ busy = true; phase = "done"; setTimeout(() => { mode = mode === "shoot" ? "save" : "shoot"; newRound(); }, 2100); }

$("actionBtn").addEventListener("click", () => {
  if(mode !== "shoot" || phase !== "power" || !aim || busy) return;
  busy = true; phase = "done"; cancelAnimationFrame(barAnim);
  const exec = execOf(barPos), zi = zoneInfo(aim.nx, aim.ny);
  const third = aim.nx < .34 ? 0 : aim.nx > .66 ? 2 : 1;
  history.push(third); if(history.length > 5) history.shift();
  const kThird = keeperPickThird();
  SFX.kick();
  flyBall(aim.x, aim.y); diveKeeper(kThird, aim.ny < .4);
  stats.shoot[1]++;
  const missP = zi.miss * (exec === "perfect" ? .5 : exec === "good" ? 1 : 2.1);
  let res;
  if(Math.random() < missP) res = "miss";
  else if(kThird === third){ const gp = exec === "perfect" ? (zi.corner ? .85 : .70) : exec === "good" ? .42 : .18; res = Math.random() < gp ? "goal" : "saved"; }
  else res = "goal";
  setTimeout(() => {
    if(res === "goal"){ stats.shoot[0]++; banner("进球！", "#ffd34d"); SFX.cheer();
      $("flavor").innerHTML = `<span class="q">${pick(["死角入网，门将鞭长莫及。", "稳稳罚进，门将判断对了也够不着。", "球进了！看台炸了。"])}</span>发力评级：${exec === "perfect" ? "完美" : exec === "good" ? "一般" : "勉强"} · 落点「${zi.name}」`; }
    else if(res === "saved"){ banner("被扑出！", "#fff"); SFX.groan();
      $("flavor").innerHTML = `<span class="q">${pick(["门将神扑！他读穿了你的落点。", "扑出去了……就差一点角度。", "太正了，被门将没收。"])}</span>门将扑向了${["左", "中", "右"][kThird]}路——${exec === "poor" ? "而且你这脚发力也飘了。" : "下次换个边或者再刁一点。"}`; }
    else { banner("打偏了！", "#fff"); SFX.groan();
      $("flavor").innerHTML = `<span class="q">${pick(["擦柱而出！死角虽好，容错太低。", "打飞了——发力没压住。", "偏出立柱，全场一声叹息。"])}</span>落点「${zi.name}」的打偏风险本就有 ${Math.round(zi.miss * 100)}%，${exec === "poor" ? "加上发力失控，" : ""}这次没兜住。`; }
    updStats(); endRound();
  }, 480);
});

function resolveSave(){
  if(busy || !savePick) return; busy = true;
  // CPU shooter: corners favored, occasional repeat tells
  const rx = Math.random(); const nx = rx < .38 ? .08 + Math.random() * .18 : rx < .76 ? .74 + Math.random() * .18 : .38 + Math.random() * .24;
  const ny = Math.random() < .58 ? .68 + Math.random() * .24 : .10 + Math.random() * .30;
  const gr = goalRect(), sr = sceneRect();
  const tx = gr.left - sr.left + nx * gr.width, ty = gr.top - sr.top + ny * gr.height;
  diveKeeper(savePick.c, savePick.r === 0);
  SFX.kick(); flyBall(tx, ty);
  stats.save[1]++;
  const cpuMiss = Math.random() < .11;
  const zx = (savePick.c + .5) / 3, zy = (savePick.r + .5) / 3;
  const d = Math.hypot(nx - zx, (ny - zy) * 1.15);
  let saved = false;
  if(!cpuMiss) saved = Math.random() < (d < .20 ? .85 : d < .36 ? .33 : .03);
  setTimeout(() => {
    if(cpuMiss){ banner("他打偏了！", "#ffd34d"); SFX.cheer(); stats.save[0]++;
      $("flavor").innerHTML = `<span class="q">对方自己罚丢了——</span>压力太大，球偏出立柱。这一分算你扑救成功。`; }
    else if(saved){ banner("扑出去了！", "#ffd34d"); SFX.cheer(); stats.save[0]++;
      $("flavor").innerHTML = d < .20
        ? `<span class="q">${pick(["神扑！你完全猜对了方向。", "单掌托出！预判满分。", "扑到了！全场起立。"])}</span>他打的是${nx < .34 ? "左" : nx > .66 ? "右" : "中"}路${ny > .5 ? "低球" : "高球"}，正落在你的区域里。`
        : `<span class="q">指尖蹭到——扑出去了！</span>他打${nx < .34 ? "左" : nx > .66 ? "右" : "中"}路${ny > .5 ? "低球" : "高球"}，不在你扑的正中，但你手长，擦着边给他捅了出去。`; }
    else { banner("球进了…", "#fff"); SFX.groan();
      $("flavor").innerHTML = `<span class="q">${pick(["他打了另一边，你扑反了。", "角度太刁，鞭长莫及。", "被骗了重心——他顿了一下才射。"])}</span>他实际打的是${nx < .34 ? "左" : nx > .66 ? "右" : "中"}路${ny > .5 ? "低球" : "高球"}，你选的是${["左", "中", "右"][savePick.c]}${["上", "中", "下"][savePick.r]}。`; }
    updStats(); endRound();
  }, 500);
}

$("resetBtn").addEventListener("click", () => { stats = { shoot: [0, 0], save: [0, 0] }; history = []; updStats(); newRound(); });
$("sndBtn").addEventListener("click", e => { muted = !muted; e.target.textContent = muted ? "🔇 音效关" : "🔊 音效开"; if(!muted) SFX.whistle(1); });
window.addEventListener("resize", () => { if(mode === "save" && phase === "aim") newRound(); });
newRound(); updStats();
</script>
</body>
</html>
